<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <style>
        /* Base / Light Mode */
        .shield-base {
            stroke: transparent;
            stroke-width: 0;
            transition: all 0.3s ease;
        }

        /* Dark Mode Optimization */
        @media (prefers-color-scheme: dark) {
            .shield-left {
                /* Subtle contrast outline on dark backgrounds */
                stroke: rgba(255, 255, 255, 0.25);
                stroke-width: 8px;
                paint-order: stroke fill;
            }
        }
    </style>

    <!-- Left Shield (Navy) -->
    <path class="shield-base shield-left" fill="#08284C" d="
        M256 24
        L56 108
        V236
        C56 364 164 452 256 488
        Z"/>

    <!-- Right Shield (Vibrant Green) -->
    <path class="shield-base" fill="#34A853" d="
        M256 24
        L456 108
        V236
        C456 364 348 452 256 488
        Z"/>

    <!-- Signature Angled 'T' Cutout -->
    <path fill="#FFFFFF" d="
        M128 128
        H384
        L336 208
        H296
        V384
        H216
        V208
        H176
        Z"/>

</svg>
